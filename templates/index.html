<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#c0392b">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
<title>ქართული — мій словник</title>
</head>
<body>
  <h1>ქართული — мій словник</h1>
  <p class="status" id="status"><span class="dot"></span><span id="status-text">…</span>
    <button type="button" id="sync-btn" title="Синхронізувати">⟳ синхр.</button>
    <button type="button" id="stats-btn" title="Статистика">📊</button>
    <button type="button" id="reminder-btn" title="Додати щоденне нагадування в календар телефону">📅</button>
    <button type="button" id="sound-btn" title="Звук, коли настає час повторення (лише поки сайт відкрито)">🔕</button>
  </p>

  <div class="wod" id="wod" hidden></div>

  <div class="stats" id="stats" hidden></div>

  <form class="add" id="add-form">
    <input name="georgian" id="f-georgian" placeholder="Грузинське слово" required autocomplete="off" autofocus lang="ka">
    <input name="translation" id="f-translation" placeholder="Переклад" required autocomplete="off" lang="uk">
    <textarea name="example" id="f-example" rows="1" placeholder="Приклад / нотатка (необов'язково)"></textarea>
    <input name="tags" id="f-tags" placeholder="Теги через кому (необов'язково)" autocomplete="off">
    <button type="submit">Додати</button>
  </form>

  <div class="btnrow">
    <button type="button" id="review-btn">🎓 Повторення</button>
    <button type="button" id="chat-btn">💬 Чат</button>
    <button type="button" id="notes-btn">📖 Нотатки</button>
  </div>
  <button type="button" id="practice-btn" hidden></button>
  <button type="button" id="sentences-btn" hidden></button>
  <button type="button" id="ai-btn" title="Речення від моделі на переклад з української — не впливає на SRS-розклад">🤖 Переклади з української</button>
  <p class="review-next" id="review-next" hidden></p>

  <div class="tagbar" id="tagbar" hidden></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Пошук…">
    <button type="button" id="csv-btn">⬇ CSV</button>
    <button type="button" id="import-btn">⬆ CSV</button>
    <input type="file" id="import-file" accept=".csv,text/csv" hidden>
  </div>

  <div id="list"></div>

  <div id="review-overlay" hidden>
    <div class="rv-top">
      <span id="rv-progress"></span>
      <span class="rv-top-btns">
        <button type="button" id="rv-mode"></button>
        <button type="button" id="rv-strict"></button>
        <button type="button" id="rv-suspend" title="Відкласти слово — прибрати з повторень" hidden>⏸</button>
        <button type="button" id="rv-close" title="Закрити">✕</button>
      </span>
    </div>
    <div class="rv-card">
      <p class="rv-dir" id="rv-dir"></p>
      <p class="rv-front" id="rv-front"></p>
      <p class="rv-cloze" id="rv-cloze" hidden></p>
      <p class="rv-verdict" id="rv-verdict" hidden></p>
      <p class="rv-back" id="rv-back" hidden></p>
      <p class="rv-ex" id="rv-ex" hidden></p>
      <p class="rv-done" id="rv-done" hidden></p>
    </div>
    <form class="rv-type" id="rv-type" hidden>
      <input id="rv-input" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Відповідь…">
      <button type="submit">Перевірити</button>
    </form>
    <div class="rv-actions">
      <button type="button" id="rv-reveal">Показати відповідь</button>
      <button type="button" id="rv-wrong" hidden>❌ Не знав</button>
      <button type="button" id="rv-right" hidden>✅ Знав</button>
      <button type="button" id="rv-retry-wrong" hidden>🔁 Ще раз провалені</button>
    </div>
    <p class="rv-hint" id="rv-hint" hidden></p>
  </div>

  <div id="sentences-overlay" hidden>
    <div class="rv-top">
      <span id="st-progress"></span>
      <span class="rv-top-btns">
        <button type="button" id="st-close" title="Закрити">✕</button>
      </span>
    </div>
    <div class="rv-card">
      <p class="rv-front" id="st-sentence" lang="ka"></p>
      <p class="rv-ex" id="st-translation"></p>
      <p class="rv-verdict" id="st-verdict" hidden></p>
      <p class="rv-cloze" id="st-grammar" hidden></p>
      <p class="rv-done" id="st-done" hidden></p>
    </div>
    <form class="rv-type" id="st-form">
      <input id="st-input" lang="ka" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="ქართული…">
      <button type="submit">Перевірити</button>
    </form>
    <div class="rv-actions">
      <button type="button" id="st-next" hidden>Далі</button>
    </div>
    <p class="rv-hint" id="st-keys" hidden>Enter — перевірити / далі · Esc — закрити</p>
  </div>

  <div id="chat-overlay" hidden>
    <div class="ch-top">
      <span class="ch-title">💬 Репетитор грузинської</span>
      <span class="rv-top-btns">
        <button type="button" id="ch-tools" title="Останні дії інструментів">🔔</button>
        <button type="button" id="ch-clear" title="Очистити історію">🗑</button>
        <button type="button" id="ch-close" title="Закрити">✕</button>
      </span>
    </div>
    <div id="tool-calls-panel" hidden></div>
    <div id="chat-log"></div>
    <form id="chat-form">
      <textarea id="chat-input" placeholder="Повідомлення…" rows="1"></textarea>
      <button type="submit" id="chat-send">➤</button>
    </form>
  </div>

  <div id="notes-overlay" hidden>
    <div class="ch-top">
      <span class="ch-title">📖 Нотатки з граматики</span>
      <span class="rv-top-btns">
        <button type="button" id="notes-add-btn" title="Нова нотатка">➕</button>
        <button type="button" id="notes-filter-btn" title="Показати лише важливі">☆</button>
        <button type="button" id="notes-review-btn" title="Повторити нотатки">🎓</button>
        <button type="button" id="notes-close" title="Закрити">✕</button>
      </span>
    </div>
    <form class="note-form" id="note-form" hidden>
      <input id="nf-title" placeholder="Назва правила" autocomplete="off" lang="uk">
      <textarea id="nf-content" rows="4" placeholder="Пояснення з прикладами…" lang="uk"></textarea>
      <div class="note-form-btns">
        <button type="submit" id="nf-save">Зберегти</button>
        <button type="button" id="nf-cancel">Скасувати</button>
      </div>
    </form>
    <div id="notes-log"></div>
    <div id="notes-review" hidden>
      <p class="rv-dir" id="nr-progress"></p>
      <div class="rv-card">
        <p class="rv-front" id="nr-title"></p>
        <p class="rv-back" id="nr-content" hidden></p>
        <p class="rv-done" id="nr-done" hidden></p>
      </div>
      <div class="rv-actions">
        <button type="button" id="nr-reveal">Показати</button>
        <button type="button" id="nr-wrong" hidden>❌ Не знав</button>
        <button type="button" id="nr-right" hidden>✅ Знав</button>
      </div>
    </div>
  </div>

  <div id="ai-overlay" hidden>
    <div class="ch-top">
      <span class="ch-title">🤖 Переклади</span>
      <span class="rv-top-btns">
        <button type="button" id="ai-gen-btn" title="Скласти нові вправи">➕</button>
        <button type="button" id="ai-practice-btn" title="Тренувати переклад">🎓</button>
        <button type="button" id="ai-close" title="Закрити">✕</button>
      </span>
    </div>
    <p class="ai-balance" id="ai-balance" hidden></p>
    <p class="ai-status" id="ai-status" hidden></p>
    <form class="note-form" id="ai-form" hidden>
      <textarea id="af-question" rows="2" placeholder="Речення українською" lang="uk"></textarea>
      <textarea id="af-answer" rows="2" placeholder="Еталон грузинською" lang="ka"></textarea>
      <textarea id="af-hint" rows="2" placeholder="Підказка з граматики (необов'язково)" lang="uk"></textarea>
      <div class="note-form-btns">
        <button type="submit" id="af-save">Зберегти</button>
        <button type="button" id="af-cancel">Скасувати</button>
      </div>
    </form>
    <div id="ai-log"></div>
    <div id="ai-practice" hidden>
      <p class="rv-dir" id="ap-progress"></p>
      <div class="rv-card">
        <p class="rv-front" id="ap-question"></p>
        <p class="rv-ex" id="ap-yours" lang="ka" hidden></p>
        <p class="rv-back" id="ap-answer" lang="ka" hidden></p>
        <p class="rv-cloze" id="ap-hint" hidden></p>
        <p class="rv-done" id="ap-done" hidden></p>
      </div>
      <form class="rv-type" id="ap-form">
        <input id="ap-input" lang="ka" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="ქართული…">
        <button type="submit">Еталон</button>
      </form>
      <div class="rv-actions">
        <button type="button" id="ap-wrong" hidden>❌ Не знав</button>
        <button type="button" id="ap-right" hidden>✅ Знав</button>
        <button type="button" id="ap-back" hidden>До списку</button>
      </div>
      <p class="ai-meta" id="ap-meta" hidden>
        <button type="button" id="ap-flag"></button>
        <span id="ap-info"></span>
      </p>
    </div>
  </div>

<script src="/static/js/overlay.js"></script>
<script src="/static/js/store.js"></script>
<script src="/static/js/catalog.js"></script>
<script src="/static/js/srs.js"></script>
<script src="/static/js/notify.js"></script>
<script src="/static/js/csv.js"></script>
<script src="/static/js/stats.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/notes.js"></script>
<script src="/static/js/sentences.js"></script>
<script src="/static/js/ai.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
